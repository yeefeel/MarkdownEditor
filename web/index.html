<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 编辑器</title>
<link rel="stylesheet" href="assets/codemirror.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="assets/github.min.css" id="hljs-theme">
</head>
<body>

<div id="err-banner" class="hidden"></div>
<div id="drop-overlay" class="hidden">松开鼠标即可打开文件（新标签）</div>

<!-- 工具栏 -->
<div id="toolbar">
  <div class="group">
    <button id="btn-new" title="新建 (Ctrl+N)">新建</button>
    <button id="btn-open" title="打开 (Ctrl+O)">打开</button>
    <button id="btn-save" title="保存 (Ctrl+S)">保存</button>
    <button id="btn-saveas" title="另存为 (Ctrl+Shift+S)">另存为</button>
  </div>
  <div class="divider"></div>
  <div class="group">
    <button id="btn-undo" title="撤销 (Ctrl+Z)">撤销</button>
    <button id="btn-redo" title="恢复 (Ctrl+Y)">恢复</button>
    <button id="btn-find" title="查找 (Ctrl+F)">查找</button>
  </div>
  <div class="divider"></div>
  <div class="group">
    <label>字体
      <select id="font-family">
        <option value="微软雅黑">微软雅黑</option>
        <option value="宋体">宋体</option>
        <option value="等线">等线</option>
        <option value="Consolas">Consolas</option>
        <option value="Courier New">Courier New</option>
        <option value="Arial">Arial</option>
      </select>
    </label>
    <label>字号
      <select id="font-size">
        <option value="12">12</option>
        <option value="13">13</option>
        <option value="14" selected>14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="20">20</option>
        <option value="22">22</option>
        <option value="24">24</option>
      </select>
    </label>
    <button id="btn-zoom-reset" title="重置缩放 (Ctrl+0)">重置缩放</button>
  </div>
  <div class="divider"></div>
  <div class="group">
    <button id="btn-mode-edit" title="仅编辑">编辑</button>
    <button id="btn-mode-split" class="active" title="分屏">分屏</button>
    <button id="btn-mode-preview" title="仅预览">预览</button>
  </div>
  <div class="divider"></div>
  <div class="group">
    <button id="btn-theme" title="切换主题">主题</button>
    <button id="btn-about" title="关于">关于</button>
  </div>
</div>

<!-- 关于对话框 -->
<div id="about-mask" class="hidden">
  <div id="about-dialog">
    <h2>Markdown 编辑器</h2>
    <div class="about-row"><span class="about-label">版本</span><span id="about-version">-</span></div>
    <div class="about-row"><span class="about-label">作者</span><span id="about-author">flyfeel@gmail.com</span></div>
    <div class="about-row"><span class="about-label">主页</span><span id="about-homepage">待补充</span></div>
    <div class="about-actions">
      <button id="btn-about-close">关闭</button>
    </div>
  </div>
</div>

<!-- 标签栏 -->
<div id="tabbar">
  <div id="tabs"></div>
  <button id="btn-new-tab" title="新建标签 (Ctrl+N)">＋</button>
</div>

<!-- 查找替换栏 -->
<div id="find-bar" class="hidden">
  <input type="text" id="find-input" placeholder="查找...">
  <input type="text" id="replace-input" placeholder="替换为...">
  <button id="btn-find-next">下一个</button>
  <button id="btn-replace">替换</button>
  <button id="btn-replace-all">全部替换</button>
  <button id="btn-find-close">关闭</button>
  <span id="find-info" class="find-info"></span>
</div>

<!-- 编辑与预览区 -->
<div id="main" class="split">
  <div id="editor-pane" class="pane">
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div id="preview-pane" class="pane">
    <div id="preview"></div>
  </div>
</div>

<!-- 状态栏 -->
<div id="statusbar">
  <span id="status-file">未命名</span>
  <span id="status-modified"></span>
  <span class="spacer"></span>
  <span id="status-zoom">100%</span>
  <span id="status-cursor">行 1, 列 1</span>
  <span id="status-count">0 字</span>
</div>

<script src="assets/marked.min.js"></script>
<script src="assets/highlight.min.js"></script>
<script src="assets/codemirror.min.js"></script>
<script src="assets/overlay.min.js"></script>
<script src="assets/xml.min.js"></script>
<script src="assets/markdown.min.js"></script>
<script src="assets/javascript.min.js"></script>
<script src="assets/gfm.min.js"></script>
<script src="assets/closebrackets.min.js"></script>
<script src="assets/active-line.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
