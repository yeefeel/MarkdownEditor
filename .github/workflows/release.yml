name: 打包发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller pywin32 pillow

      - name: 打包为单文件 exe
        run: python -m PyInstaller build.spec --clean --noconfirm

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = 'dist/MarkdownEditor.exe'
          if (-not (Test-Path $exe)) { throw '打包失败：未生成 dist/MarkdownEditor.exe' }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "产物大小：$size MB"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownEditor
          path: dist/MarkdownEditor.exe
          if-no-files-found: error

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MarkdownEditor.exe
          name: MarkdownEditor ${{ github.ref_name }}
          generate_release_notes: true
